<section class="custom-login-page">
	<div class="container py-5 h-100">
		<div class="row d-flex justify-content-center align-items-center h-100">
			<div class="col-12 col-md-8 col-lg-6 col-xl-5">
				<div class="custom-login-card">
					<div class="custom-login-body">

						<a class="navbar-brand custom-title" routerLink="/">
							Wiki<span class="custom-title-game">game</span>
						</a>

						<p class="custom-login-subtitle">
							Inserisci il codice a 6 cifre che ti abbiamo inviato via email
						</p>

						<form [formGroup]="form" (ngSubmit)="verify()">
							<div class="custom-form-field">
								<label for="otp">Codice di verifica</label>
								<div class="custom-input-container">
									<i class="bi bi-shield-lock"></i>
									<input id="otp" type="text" class="form-control" placeholder="123456"
										inputmode="numeric" autocomplete="one-time-code" maxlength="6"
										formControlName="otp" />
								</div>
							</div>

							@if (errorMessage()) {
								<div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
									<i class="bi bi-exclamation-circle"></i>
									<span>{{ errorMessage() }}</span>
								</div>
							}

							<button class="custom-login-submit" type="submit" [disabled]="loading()">
								@if (loading()) {
									<span class="spinner-border spinner-border-sm"></span>
								} @else {
									<i class="bi bi-check2-circle"></i>
								}
								<span>Verifica</span>
							</button>
						</form>

						<p class="custom-register-text">
							<a routerLink="/login" (click)="cancel()">Torna al login</a>
						</p>

					</div>
				</div>
			</div>
		</div>
	</div>
</section>
