<div>
	<nav class="navbar">
		<div class="container-fluid">
			<div class="custom-font-title">
				<a class="navbar-brand" href="#">Wikigame</a>
			</div>
			<div class="custom-search-bar d-flex align-items-md-center gap-2">
				<form role="search">
					<div class="position-relative">
						<input class="form-control rounded-pill pe-5" type="search" placeholder="Search"
							aria-label="Search" />
						<button class="btn border-0 position-absolute top-50 end-0 translate-middle-y" type="submit"
							aria-label="Search">
							<i class="bi bi-search"></i>
						</button>
					</div>
				</form>
			</div>
			<div class="custom-menu custom-theme-button">
				<button class="btn theme-button" (click)="changeTheme()">
					@if (isDarkMode()) {
						<i class="bi bi-moon fs-4 custom-thene-icon" ></i>
					} @else {
						<i class="bi bi-sun fs-4 custom-thene-icon" ></i>
					}
				</button>
				<button class="navbar-toggler" type="button" aria-label="Toggle navigation"
					(click)="changeVisibility()">
					<span class="navbar-toggler-icon"></span>
				</button>
			</div>

			<div class="offcanvas offcanvas-end" [class.show]="visibile()" tabindex="-1" id="offcanvasNavbar">
				<div class="offcanvas-header">
					<h5 class="offcanvas-title">Offcanvas</h5>
					<button type="button" class="btn-close" aria-label="Close" (click)="changeVisibility()"></button>
				</div>

				<div class="offcanvas-body">
					<ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
						<li class="nav-item">
							<a class="nav-link active" aria-current="page" href="#">Home</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#">Link</a>
						</li>
						<li class="nav-item dropdown">
							<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
								aria-expanded="false">
								Dropdown
							</a>
							<ul class="dropdown-menu">
								<li><a class="dropdown-item" href="#">Action</a></li>
								<li><a class="dropdown-item" href="#">Another action</a></li>
								<li>
									<hr class="dropdown-divider">
								</li>
								<li><a class="dropdown-item" href="#">Something else here</a></li>
							</ul>
						</li>
					</ul>
				</div>
			</div>
		</div>
	</nav>
</div>
