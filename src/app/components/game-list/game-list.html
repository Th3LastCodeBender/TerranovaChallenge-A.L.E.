<div class="container-fluid px-4 px-xl-5 mb-4">
    @if (search()) {
        <h4 class="mb-3">Risultati per "{{ search() }}"</h4>
    }

    @if (loading()) {
        <div class="text-center py-5"><div class="spinner-border" role="status"></div></div>
    } @else {
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-3">
            @for (game of games(); track game.id) {
                <div class="col">
                    <app-game-card [game]="game"></app-game-card>
                </div>
            } @empty {
                <p class="text-center py-5">
                    {{ search() ? 'Nessun gioco trovato' : 'Cerca un gioco dalla barra in alto' }}
                </p>
            }
        </div>

        @if (games().length > 0) {
            <div class="d-flex justify-content-center gap-2 mt-4">
                <button class="btn btn-outline-light" [disabled]="page() === 1" (click)="goToPage(page() - 1)">Indietro</button>
                <span class="align-self-center">Pagina {{ page() }}</span>
                <button class="btn btn-outline-light" [disabled]="!hasMore()" (click)="goToPage(page() + 1)">Avanti</button>
            </div>
        }
    }
</div>
