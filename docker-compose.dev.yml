services:
  backend:
    build: !override
      context: ./Docker/backend
      dockerfile: backend.dev.Dockerfile
    image: terranova-backend-dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm exec prisma migrate deploy && pnpm exec next dev -H 0.0.0.0 -p 8080"
    volumes:
      - ./app/02_backend:/app
      - backend_node_modules:/app/node_modules
      - backend_next:/app/.next

  frontend:
    build: !reset null
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npx ng serve --host 0.0.0.0 --proxy-config /proxy.json"
    volumes: !override
      - ./app/01_frontend:/app
      - ./Docker/frontend/proxy.dev.json:/proxy.json:ro
      - frontend_node_modules:/app/node_modules
      - frontend_angular:/app/.angular
    ports: !override
      - "127.0.0.1:4200:4200"

volumes:
  frontend_node_modules:
  frontend_angular:
  backend_node_modules:
  backend_next: