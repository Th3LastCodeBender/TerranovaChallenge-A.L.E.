name: terranova

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - backend
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?manca nel .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manca nel .env}
      POSTGRES_DB: ${POSTGRES_DB:?manca nel .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?manca nel .env}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  backend:
    build:
      context: ./app/02_backend
      dockerfile: ../../Docker/backend/backend.Dockerfile
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?manca nel .env}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?manca nel .env}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:?manca nel .env}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(() => process.exit(0), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - backend
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./app/01_frontend
      dockerfile: ../../Docker/frontend/frontend.Dockerfile
    volumes:
      - ./Docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  ollama_models:

networks:
  backend:
  frontend: