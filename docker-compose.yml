name: terranova

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?manca in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manca in .env}
      POSTGRES_DB: ${POSTGRES_DB:?manca in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:

networks:
  back: