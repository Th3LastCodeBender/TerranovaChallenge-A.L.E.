name: terranova

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?manca nel .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manca nel .env}
      POSTGRES_DB: ${POSTGRES_DB:?manca nel .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./app/02_backend
      dockerfile: ../../Docker/backend/backend.Dockerfile
    environment:
      Rawg__ApiKey: ${Rawg__ApiKey:?manca nel .env}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./app/01_frontend
      dockerfile: ../../Docker/frontend/frontend.Dockerfile
    volumes:
      - ./Docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - frontend
    restart: unless-stopped
volumes:
  pgdata:

networks:
  backend:
  frontend: